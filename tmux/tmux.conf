# tmux conf

set -ga terminal-overrides ",xterm-256color:Tc"

set-option -g  detach-on-destroy off

# [ SET OPTIONS ] = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

# Message Bar Style
set -g message-style fg=yellow,bg=default,bold
set -g message-command-style fg=yellow,bg=brightblack,bold

# STATUS BAR CONFIG
set -g status on
set -g status-interval 5
set -g focus-events on
set -g status-style bg=default,fg=brightwhite
set -g status-justify left
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 200
set -g status-left "#[fg=black,bold]#{?client_prefix,#[bg=brightgreen] 󰌽 ,#[bg=yellow] 󰌽 }#[bold,nodim]#S #[default] " # Left
set -g window-status-current-format "#[fg=black, bg=yellow,bold]#{?#{==:#{pane_current_command},ssh}, 󰭅,} #I #[fg=brightwhite,bg=black,bold] #W#{?window_zoomed_flag,:z,} #[default]" # Active
set -g window-status-format "#[fg=brightwhite, bg=brightblack]#{?#{==:#{pane_current_command},ssh}, 󰭅,} #I #[fg=brightwhite,bg=black] #W#{?window_zoomed_flag,:z,} #[default]" # Inactive
set -g status-right " #[fg=brightwhite,bg=black] #(echo #{pane_current_path} | sed \"s|^$HOME|~|\") #[fg=black,bold]#{?client_prefix,#[bg=brightgreen],#[bg=yellow]} %d/%M %I:%M %p "         # Right

# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

set -g mouse on
set-window-option -g mode-keys vi

# [ KEY BINDINGS ] = = = = = = = =  = = = = = = = = = = = = = = = = = = = = = = = = = =

# source 'tmux.conf' file
bind r source-file ~/.config/tmux/tmux.conf

# toggle status
bind T set-option -g status

# open apps in tmp window
bind-key g run-shell "tmux new-window -c '#{pane_current_path}' lazygit"
bind-key f run-shell "tmux new-window -c '#{pane_current_path}' lf"
bind-key h run-shell "tmux new-window 'nvtop'"

bind v copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

bind - split-window -v -l 17 -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"


# [ SHELL ] = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

bind -n C-x run-shell ' cs=$(tmux display -p "#{session_name}")
if [ "$cs" = xz ]; then
  tmux switch -l
else
  tmux has -t xz 2>/dev/null || tmux new -ds xz -c ~
  tmux switch -t xz
fi
'

