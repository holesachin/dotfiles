# tmux conf

# kitty
# set-option -g default-terminal 'tmux-256color'
# set-option -sa terminal-features ',xterm-kitty:RGB'

# currenty working for 'kitty'
set -ga terminal-overrides ",xterm-256color:Tc"

# alacritty
# set -g default-terminal 'tmux-256color'
# set -as terminal-overrides ",alacritty*:Tc"

set-option -g  detach-on-destroy off

# [ SET OPTIONS ] = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

# Message Bar Style
set -g message-style fg=yellow,bg=default,bold
set -g message-command-style fg=magenta,bg=brightblack,bold

# STATUS BAR CONFIG
set -g status on
set -g status-interval 5
set -g focus-events on
set -g status-style bg=default,fg=brightwhite
set -g status-justify left
set -g status-position top
set -g status-left-length 100
set -g status-right-length 200
set -g status-left "#[fg=black]#{?client_prefix,#[bg=brightgreen] 󰌽 ,#[bg=magenta]  }#S #[default] " # Left
set -g window-status-current-format "#[fg=black, bg=magenta,bold]#{?#{==:#{pane_current_command},ssh}, 󰭅,} #I #[fg=brightwhite,bg=black,bold] #W#{?window_zoomed_flag, z,} #[default]" # Active
set -g window-status-format "#[fg=brightwhite, bg=brightblack]#{?#{==:#{pane_current_command},ssh}, 󰭅,} #I #[fg=brightwhite,bg=black] #W#{?window_zoomed_flag,:z,} #[default]" # Inactive
set -g status-right " #[fg=blue]󰄌 #(cat /sys/class/power_supply/BAT0/capacity)% #[fg=brightwhite,bg=black] #(echo #{pane_current_path} | sed \"s|^$HOME|~|\") #[fg=black,bold]#{?client_prefix,#[bg=brightgreen],#[bg=magenta]} %d/%M %I:%M %p "         # Right

# start windows and panes at 1, not 0
set -g base-index 1 
setw -g pane-base-index 1
set-option -g renumber-windows on

set -g mouse on
set-window-option -g mode-keys vi

# [ KEY BINDINGS ] = = = = = = = =  = = = = = = = = = = = = = = = = = = = = = = = = = =

# source 'tmux.conf' file
bind r source-file ~/.config/tmux/tmux.conf

# toggle status
bind T set-option -g status

# open apps in tmp window
bind-key g run-shell "tmux new-window -c '#{pane_current_path}' lazygit"
bind-key f run-shell "tmux new-window -c '#{pane_current_path}' lf"
bind-key h run-shell "tmux new-window 'nvtop'"

bind v copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

bind - split-window -v -l 17 -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"


# [ SHELL ] = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

bind -n C-z run-shell "tmuxer"

bind -n C-o popup -E -d "${pane_current_path}" -w 90% -h 90% "opencode"

# Session switcher - switch to nixos session (creates if not exists)
bind ' ' run-shell "tmux new-session -ADs nixos"

# [ PLUGINS ] = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# [ PLUGIN CONFIG ] = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =  =


# [ AUTORUN ] = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

# TPM installation directory
set -g @tpm_dir "$HOME/.local/share/tmux/plugins/tpm"

# Install TPM if not present (shallow clone for speed)
if-shell "[ ! -d #{@tpm_dir} ]" \
	"run-shell 'mkdir -p #{@tpm_dir%/*} && git clone --depth 1 https://github.com/tmux-plugins/tpm #{@tpm_dir}'"

# Initialize TPM (must be at the very bottom of tmux.conf)
run-shell "#{@tpm_dir}/tpm"
