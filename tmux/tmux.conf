# tmux conf

# kitty
# set-option -g default-terminal 'tmux-256color'
# set-option -sa terminal-features ',xterm-kitty:RGB'

# currenty working for 'kitty'
set -ga terminal-overrides ",xterm-256color:Tc"

# alacritty
# set -g default-terminal 'tmux-256color'
# set -as terminal-overrides ",alacritty*:Tc"

set-option -g  detach-on-destroy off

# [ SET OPTIONS ] = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

# Message Bar Style
set -g message-style fg=yellow,bg=brightblack,bold
set -g message-command-style fg=magenta,bg=brightblack,bold

# STATUS BAR CONFIG
set -g status on
set -g status-interval 5
set -g focus-events on
set -g status-style bg=default,fg=white
set -g status-justify left
set-option -g status-position top

# Left
set -g status-left-length 100
set -g status-left "#[fg=black,bold]#{?client_prefix,#[bg=blue] 󰌽 ,#[bg=green,dim] 󰌽 }#[bold,nodim]#S #[default] "

# Active
set -g window-status-current-format "#[fg=black,bg=yellow,bold] #{?#{==:#{pane_current_command},ssh},󰣀 ,  }#I #W#{?window_zoomed_flag,:z,} #[default]"

# Inactive
set -g window-status-format "#[fg=white,bg=brightblack] #{?#{==:#{pane_current_command},ssh},󰣀 ,}#I #W#{?window_zoomed_flag, z,} #[default]"

# Right
set -g status-right-length 200
set -g status-right " #[fg=orange] #[default] #(~/.local/scripts/notty) #[fg=blue] 󰄌 #(cat /sys/class/power_supply/BAT0/capacity)% #[fg=white,bg=brightblack] #(echo #{pane_current_path} | sed \"s|^$HOME|~|\") #[fg=black,bold]#{?client_prefix,#[bg=blue],#[bg=green]} %d %B %Y %I:%M %p "

# start windows and panes at 1, not 0
set -g base-index 1 
setw -g pane-base-index 1

set -g mouse on
set-window-option -g mode-keys vi

# [ KEY BINDINGS ] = = = = = = = =  = = = = = = = = = = = = = = = = = = = = = = = = = =

# source 'tmux.conf' file
bind r source-file ~/.config/tmux/tmux.conf

# toggle status
bind T set-option -g status

# open apps in tmp window
bind-key g run-shell "tmux new-window -c '#{pane_current_path}' lazygit"
bind-key f run-shell "tmux new-window -c '#{pane_current_path}' lf"
bind-key h run-shell "tmux new-window 'nvtop'"

bind v copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

bind - split-window -v -l 17 -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"


# [ SHELL ] = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

bind -n C-x run-shell "
current_session=\$(tmux display-message -p '#{session_name}')
if [ \"\$current_session\" = \"scratch\" ]; then
  tmux switch-client -l
else
  if tmux has-session -t scratch 2>/dev/null; then
    tmux switch-client -t scratch
  else
    tmux new-session -ds scratch && tmux switch-client -t scratch
  fi
fi
"
# run command from list in seperate pane
bind-key k run-shell "tmux split-window -v -l 13 'bash -c \"$(echo ls | fzf --info inline)\"; read'"

bind-key S display-popup -E -w 50% -h 60% -T "SESSION MANAGER" "~/.config/tmux/bin/session"


# [ PLUGINS ] = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# [ PLUGIN CONFIG ] = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =  =

# tmux resurrect 
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum
set -g @continuum-restore 'on'
# set -g @continuum-boot 'on'  # start tmux at boot
# set -g @continuum-boot-options 'kitty'


# [ AUTORUN ] = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

# install 'tpm' tmux package manager if not installed
if-shell '[ ! -d ~/.local/share/tmux/tpm ]' \
  'run-shell "git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/tpm && ~/.local/share/tmux/tpm/bin/install_plugins"'

# initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell '[ -x ~/.local/share/tmux/tpm/tpm ]' \
  'run-shell "~/.local/share/tmux/tpm/tpm"'
