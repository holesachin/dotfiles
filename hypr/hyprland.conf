# = Variable = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

$HYPRLAUNCH = ~/.config/hypr/scripts/hyprlauncher
$VOLUME = ~/.local/scripts/volume
$BLUETOOTH = ~/.local/scripts/blt

# = Include Files  = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

source = ~/.config/hypr/monitors.conf

# = Enviroment Varibles = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

# env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1
env = WLR_NO_HARDWARE_CURSORS,1
env = NIXOS_OZONE_WL,1

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1

# = Autostart Programs = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

exec-once = nm-applet --indicator &
exec-once = blueman-applet &
exec-once = mpd &
exec-once = dunst &
exec-once = swaybg --output eDP-1 --mode fit -i ~/.config/bg.png --output HDMI-A-1 --mode fit -i ~/.config/bg2.png &
exec-once = ~/.local/scripts/rofi-polkit -theme ~/.config/rofi/config.rasi & # Launches rofi-polkit
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

# = Monitor & Workspace = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

workspace = 1, monitor:eDP-1, default:true, on-created-empty:$TERMINAL
workspace = 2, monitor:eDP-1, on-created-empty:zen-beta
workspace = 3, monitor:eDP-1
workspace = 4, monitor:HDMI-A-1, default:true
workspace = 5, monitor:HDMI-A-1 

workspace = special:special, bordersize:1, on-created-empty:scrcpy

# = Input  = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

input {
	kb_layout = us
	follow_mouse = 1
	touchpad {
		natural_scroll = false
	}
	sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# = General  = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = 

general {
	gaps_in = 0
	gaps_out = 0
	border_size = 3
	col.active_border = rgba(BD93F9DF)
	col.inactive_border = rgba(282C34DF)
	layout = master
}

# = Decoration = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = 

decoration {
	# = Rouncd Corner  
	rounding = 0

	# = Opacity 
	active_opacity = 1
	inactive_opacity = 1

	# = Blur     
	blur {
		enabled = true
		size = 3
		passes = 3
		ignore_opacity = true
		xray = false
		new_optimizations = true
	}
}

# = Animations = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = 

animations {
	enabled = false
	bezier = myBezier, 0.01, 0.9, 0.1, 1.05
	animation = windows, 1, 7, myBezier
	animation = windowsOut, 1, 7, default, popin 80%
	animation = border, 1, 10, default
	animation = borderangle, 1, 8, default
	animation = fade, 1, 7, default
	animation = workspaces, 1, 6, default
}

# = Misc = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
}

# = Layouts = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = 

dwindle {
	pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
	preserve_split = true # you probably want this
}

# = Workspace Managemnet = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
workspace = special:scratchpad, on-created-empty:foot

# = Window Managemnet = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
bind = SUPER SHIFT, Q, killactive,          # kill focused window
bind = SUPER, SPACE, togglefloating,        # toggle floating window
bind = SUPER, P, pseudo, # dwindle          
bind = SUPER, J, togglesplit, # dwindle
bind = SUPER, F, fullscreen,
# bind = SUPER, K, fakefullscreen,

# = Reload Hyprland
bind = SUPER SHIFT, R, exec, hyprctl reload

# = 
# bind = ALT, Y, submap, subspace
# submap = subspace
#
# bind = SUPER, T,exec, alacritty
#
# bind = , escape, submap, reset
# submap = reset

# = Applications = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = 
bind = SUPER, RETURN, exec, $HYPRLAUNCH alacritty 1 "alacritty" "Alacritty"
bind = SUPER, W, exec, $HYPRLAUNCH qutebrowser 9 "qutebrowser" "org.qutebrowser.qutebrowser"
bind = SUPER  SHIFT, W, exec, $HYPRLAUNCH zen-beta 2 "zen-beta" "zen-beta"
bind = SUPER  SHIFT, F, exec, caja

bind = SUPER, C, exec, ~/.local/scripts/zinput &

# = Color Picker
bindr = SUPER SHIFT, P, exec, pkill hyprpicker || hyprpicker | wl-copy

# = Rofi 
bindr = SUPER, D, exec, pkill rofi || rofi -show drun -theme ~/.config/rofi/config.rasi
bindr = SUPER, R, exec, pkill rofi || rofi -show run
bindr = SUPER, V, exec, pkill rofi || cliphist list | rofi -dmenu -theme ~/.config/rofi/config.rasi -display-columns 2 | cliphist decode | wl-copy
bindr = SUPER, X, exec, pkill nwg-bar || nwg-bar #~/.local/scripts/powermenu
bindr = SUPER, S, exec, pkill rofi || search
bindr = SUPER, B, exec, pkill rofi || $BLUETOOTH

bindr = SUPER, b, exec, pkill waybar || waybar &

# = Terminal Applications
bind = SUPER SHIFT, C, exec, pkill ncmpcpp    || alacritty -t ' Music Player - ncmpcpp ' --class float -e ncmpcpp
bind = SUPER SHIFT, A, exec, pkill pulsemixer || alacritty -t ' Audio Mixer - pulsemixer ' --class float -e pulsemixer
bind = SUPER SHIFT, G, exec, pkill glances    || alacritty -t ' Glances ' -e glances

# = Wallpaper
bind = SUPER SHIFT, I, exec, sxiv -rbtg 1047x570 /usr/share/backgrounds $HOME/pix/walls $HOME/pix/wallpapers

# = Scratchpad 
bind = SUPER SHIFT,S,movetoworkspace,special
bind = SUPER SHIFT, RETURN, togglespecialworkspace

# = Web Applications 
bind = SUPER, S, exec, qutebrowser "https://app.slack.com/client/T09DR3X9D09/C09DFBFHQKW" 
bind = SUPER, T, exec, alacritty -e ~/.local/scripts/tmuxer

# = Sceenshot = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

# = fullscreen
bind = , Print, exec, hyprshot -m output  -o $HOME/pix/shots -f shot:$(date +%I%N%d%m%Y).png

# = select area 
bind = SUPER, Print, exec, hyprshot -m region -o $HOME/pix/shots -f shot:$(date +%I%N%d%m%Y).png

# = select window
bind = SUPER SHIFT, Print, exec, hyprshot -m window -o $HOME/pix/shots -f shot:$(date +%I%N%d%m%Y).png

# = Media Keys  = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = 

# = Audio Controll  

binde = , XF86AudioRaiseVolume, exec, $VOLUME inc #wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
binde = , XF86AudioLowerVolume, exec, $VOLUME dec #wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bind  = , XF86AudioMute, exec, $VOLUME mute #wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# = Music Controll

bind = , XF86AudioNext, exec, mpc next
bind = , XF86AudioPrev, exec, mpc prev
bind = , XF86AudioPlay, exec, mpc toggle
bind = , XF86AudioStop, exec, mpc stop

# = Brightness 

binde = , XF86MonBrightnessDown, exec, brightnessctl set 1%-
binde = , XF86MonBrightnessUp, exec, brightnessctl set 1%+

# = Window Focus  = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = 

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# = Window Move = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = 

bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, j, movewindow, u
bind = SUPER SHIFT, k, movewindow, d

# = Window Resize = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = 

binde = SUPER CTRL, left, resizeactive, -5 0
binde = SUPER CTRL, right, resizeactive, 5 0
binde = SUPER CTRL, up, resizeactive, 0 -5
binde = SUPER CTRL, down, resizeactive, 0 5

binde = SUPER CTRL, H, resizeactive, -1 0
binde = SUPER CTRL, L, resizeactive, 1 0
binde = SUPER CTRL, K, resizeactive, 0 -1
binde = SUPER CTRL, J, resizeactive, 0 1

# = Switch Workspace = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

bind = SUPER, TAB, workspace, previous

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7

bind = SUPER, I, workspace, 4
bind = SUPER, O, workspace, 5

# = Move Workspace = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

bind = SUPER SHIFT, I, movetoworkspace, 4
bind = SUPER SHIFT, O, movetoworkspace, 5

# = Mouse Keybinds = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# = Window Rules = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = 

windowrulev2 = workspace 1 silent,class:^(Alacritty)$
windowrulev2 = workspace 2 silent,class:^(zen-beta)$
windowrulev2 = workspace 5 silent,class:^(org.qutebrowser.qutebrowser)$

windowrule = tile, class:^(kitty)$
windowrule = float, class:file_progress
windowrule = float, class:confirm
windowrule = float, class:dialog
windowrule = float, class:download
windowrule = float, class:notification
windowrule = float, class:error
windowrule = float, class:splash
windowrule = float, class:confirmreset
windowrule = float, title:Open File
windowrule = float, title:branchdialog
windowrule = float, class:Lxappearance
windowrule = float, class:Viewnior
windowrule = float, class:feh
windowrule = float, class:float
windowrule = center, class:feh
windowrule = size 1115 600,  class:float
windowrule = float, class:pavucontrol-qt
windowrule = float, class:pavucontrol
windowrule = float, class:file-roller
windowrule = fullscreen, class:wlogout
windowrule = float, title:wlogout
windowrule = fullscreen, title:wlogout
windowrule = idleinhibit focus, class:mpv
windowrule = float, title:^(Media viewer)$
windowrule = float, title:^(Volume Control)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = float, title:^(Blueman Manager)$
windowrule = float, class:^(.blueman-manager-wrapped)$
windowrule = size 1110 600, class:^(.blueman-manager-wrapped)$

