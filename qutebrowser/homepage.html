<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Page</title>
<style>
    :root {
        --bg: #282a36;
        --current-line: #44475a;
        --fg: #f8f8f2;
        --comment: #6272a4;
        --cyan: #8be9fd;
        --green: #50fa7b;
        --pink: #ff79c6;
    }

    body {
        background-color: var(--bg);
        color: var(--fg);
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }

    .clock {
        font-size: 4rem;
        font-weight: bold;
        margin-bottom: 1rem;
        color: var(--green);
    }

    .search-container {
        display: flex;
        background: var(--current-line);
        border-radius: 8px;
        overflow: hidden;
        width: 400px;
        max-width: 90%;
    }

    .search-container input {
        flex: 1;
        padding: 0.7rem 1rem;
        border: none;
        outline: none;
        font-size: 1rem;
        background: transparent;
        color: var(--fg);
    }

    .search-container button {
        background: var(--pink);
        border: none;
        padding: 0.7rem 1rem;
        cursor: pointer;
        font-size: 1rem;
        color: var(--fg);
    }

    .search-container button:hover {
        background: var(--cyan);
        color: var(--bg);
    }
</style>
</head>
<body>

<div class="clock" id="clock">00:00:00</div>

<form class="search-container" onsubmit="searchGoogle(event)">
    <input type="text" id="searchBox" placeholder="Search Google..." autofocus>
    <button type="submit">SEARCH</button>
</form>

<script>
    function updateClock() {
        const now = new Date();
        document.getElementById("clock").textContent =
            now.toLocaleTimeString("en-US", { hour12: true });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function searchGoogle(e) {
        e.preventDefault();
        const query = document.getElementById("searchBox").value.trim();
        if (query) {
            window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        }
    }
</script>

</body>
</html>
